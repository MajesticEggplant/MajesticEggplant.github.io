  <title>Today's Words</title>
  <style>
    body {
      margin: 0;
      padding: 2rem 1rem;
      box-sizing: border-box;

      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow-x: hidden;
      background-color: #f9f9f9;
      font-family: 'Segoe UI', sans-serif;
      flex-direction: column;
    }

    body[data-tool="seed"],
    body[data-tool="gun"],
    body[data-tool="degree"] {
      cursor: crosshair;
    }

    .small-text {
      font-size: 1rem;
      color: #555;
      margin-bottom: 0.5rem;
    }

    .large-text {
      font-size: 3rem;
      color: #222;
      text-align: center;
    }

    .def {
      font-size: 0.95rem;
      font-style: italic;
      color: #777;
      text-align: center;
      max-width: 40ch;
      margin-bottom: 1.5rem;
    }

    #word, #word2, #word3 {
      cursor: pointer;
      user-select: none;
    }

    .pop {
      position: fixed;
      font-size: 3rem;
      pointer-events: none;
      z-index: 4;
    }

    .person {
      position: fixed;
      left: 0;
      top: 0;
      pointer-events: none;
      z-index: 2;
    }

    .particle {
      position: fixed;
      line-height: 1;
      pointer-events: none;
      z-index: 4;
    }

    .counter {
      margin-top: 1rem;
      text-align: center;
      cursor: pointer;
      user-select: none;
    }

    .chicken {
      position: fixed;
      left: 0;
      top: 0;
      line-height: 1;
      pointer-events: none;
      z-index: 2;
    }

    .item {
      position: fixed;
      font-size: 1.6rem;
      line-height: 1;
      transform: translate(-50%, -100%);
      pointer-events: none;
      z-index: 1;
    }

    .pile {
      position: fixed;
      left: 0;
      top: 0;
      width: 40px;
      height: 20px;
      border-radius: 50%;
      background: radial-gradient(#c8902e 35%, transparent 40%) 0 0 / 6px 6px;
      pointer-events: none;
      z-index: 1;
    }

    .tool {
      position: fixed;
      bottom: 1rem;
      font-size: 2rem;
      background: #fff;
      border: 2px solid #ddd;
      border-radius: 50%;
      width: 3.5rem;
      height: 3.5rem;
      cursor: pointer;
      z-index: 3;
    }

    #seed {
      right: 1rem;
    }

    #gun {
      left: 1rem;
    }

    #fire {
      left: 5.5rem;
    }

    #degree {
      left: 10rem;
    }

    body[data-tool="seed"] #seed,
    body[data-tool="gun"] #gun,
    body[data-tool="degree"] #degree {
      border-color: #c8902e;
    }

    img {
      margin-top: 1rem;
      max-width: 80%;
    }
  </style>
</head>

    // cyrb53
    const hashFunc = function (str, seed = 0) {
      let h1 = 0xdeadbeef ^ seed, h2 = 0x41c6ce57 ^ seed;
      for (let i = 0, ch; i < str.length; i++) {
        ch = str.charCodeAt(i);
        h1 = Math.imul(h1 ^ ch, 0x85ebca77);
        h2 = Math.imul(h2 ^ ch, 0xc2b2ae3d);
      }

      h1 ^= Math.imul(h1 ^ (h2 >>> 15), 0x735a2d97);
      h2 ^= Math.imul(h2 ^ (h1 >>> 15), 0xcaf649a9);
      h1 ^= h2 >>> 16;
      h2 ^= h1 >>> 16;

      return 2097152 * (h2 >>> 0) + (h1 >>> 11);
    }

    const today = new Date();
    const dateString = today.toISOString().slice(0, 10); // data UTC: in Italia le parole cambiano all'una di notte

    // Ogni riga ha il suo seed, altrimenti con liste lunghe uguali uscirebbero sempre accoppiate
    const pick = (dict, seed) => {
      const entries = Object.entries(dict);
      return entries[hashFunc(dateString, seed) % entries.length];
    };

    const $ = id => document.getElementById(id);

    const [a, aDef] = pick(wordsA, 0);
    const [w2, w2Def] = pick(words2, 1);

    $('word2').textContent = w2;

    // Emoji che sale dal punto del click e svanisce
    const popEmoji = (id, emoji) => $(id).addEventListener('click', function (e) {

    popEmoji('word', '🚗');

    const mode = Math.random();

    if (mode < 0.8) {

    } else {

    }

    // Con The Game o il Rickroll la pagina mostra solo quello
    if (mode >= 0.8) {
      for (const el of document.body.children) {
        if (el.id !== 'word' && el.tagName !== 'SCRIPT') {
          el.hidden = true;
        }
      }
    }

    // Ritardo del survey

    // ponytail: fixed to 1 Nov 2026, local time
    const start = new Date(2026, 10, 1);
    const addMonths = (d, m) => new Date(d.getFullYear(), d.getMonth() + m, d.getDate());

    const departures = [
      { id: 'leave1', who: 'il primo', date: new Date(2026, 10, 30) },
      { id: 'leave2', who: 'il secondo', date: new Date(2026, 11, 28) },
    ];

    const tick = function () {
      const now = new Date();
      let months = (now.getFullYear() - start.getFullYear()) * 12 + now.getMonth() - start.getMonth();

      if (addMonths(start, months) > now) {
        months--;
      }

      let rest = Math.floor((now - addMonths(start, months)) / 1000);
      const seconds = rest % 60;
      rest = Math.floor(rest / 60);
      const minutes = rest % 60;
      rest = Math.floor(rest / 60);
      const hours = rest % 24;
      const days = Math.floor(rest / 24);

      // salta le unità a zero, i secondi restano sempre
      const parts = [
        [Math.floor(months / 12), 'anno', 'anni'],
        [months % 12, 'mese', 'mesi'],
        [days, 'giorno', 'giorni'],
        [hours, 'ora', 'ore'],
        [minutes, 'minuto', 'minuti'],
      ]
        .filter(([v]) => v > 0)
        .map(([v, one, many]) => `${v} ${v === 1 ? one : many}`);

      parts.push(`${seconds} ${seconds === 1 ? 'secondo' : 'secondi'}`);
      $('elapsed').textContent = parts.join(', ');

      // giorni di calendario, non blocchi di 24 ore da adesso
      const midnight = new Date(now.getFullYear(), now.getMonth(), now.getDate());

      for (const d of departures) {
        const days = Math.round((d.date - midnight) / 86400000);
        const n = Math.abs(days);

        $(d.id + 'Label').textContent = days > 0
          ? `Giorni a quando se ne va ${d.who}:`
          : `Giorni da quando se n'è andato ${d.who}:`;
        $(d.id + 'Days').textContent = `${n} ${n === 1 ? 'giorno' : 'giorni'}`;
      }
    };

    tick();
    setInterval(tick, 250); // a 1000 ms ogni tanto un secondo verrebbe saltato

    // Polli e semi

    const MAX_CHICKENS = 30;     // uova comprese
    const FOOD_RADIUS = 250;     // px entro cui un pollo sente il mucchio
    const PILE_SIZE = 10;        // semi per mucchio; un pollo ne mangia uno al secondo
    const SEEDS_PER_DROP = 6;
    const EGG_CHANCE = 0.4;      // altrimenti cacca; i pulcini fanno solo cacca
    const POO_LIFE = 8000;       // ms
    const HATCH_TIME = 15000;
    const GROW_TIME = 60000;     // da pulcino a gallina
    const STARVE_TIME = 60000;   // tanto si resiste senza mangiare
    const GRAVE_LIFE = 10000;
    const GHOST_CHANCE = 0.05;   // probabilità che da una lapide esca un fantasma
    const FLEE_RADIUS = 150;     // px: più vicino di così al fantasma, si scappa
    const GHOST_LIFE = 7000;
    const OMELETTE_LIFE = 10000;
    const ROAST_LIFE = 10000;

    const chickens = [];
    const piles = [];
    const items = [];  // uova, cacche, lapidi, frittate: stanno fermi finché scadono
    const ghosts = [];
    let tool = null;  // 'seed', 'gun', 'degree' o niente
    let diploma = null;  // uno solo in pagina

    // Orologio del gioco: si ferma con la tab in background, sennò al ritorno sono tutti morti
    let clock = 0;
    let lastTs = null;

    const rand = (lo, hi) => lo + Math.random() * (hi - lo);
    const clampX = x => Math.min(Math.max(x, 20), innerWidth - 20);
    const clampY = y => Math.min(Math.max(y, 20), innerHeight - 20);
    const eggCount = () => items.filter(it => it.kind === 'egg').length;
    const isFull = () => chickens.length + eggCount() >= MAX_CHICKENS;

    const addItem = function (kind, emoji, x, y, life) {
      const el = document.createElement('div');
      el.className = 'item';
      el.textContent = emoji;
      el.style.left = x + 'px';
      el.style.top = y + 'px';
      document.body.appendChild(el);

      const it = { el, kind, x, y, until: clock + life };
      items.push(it);

      return it;
    };

    // Esce dalla lapide, vaga un po' e svanisce
    const ghost = function (x, y) {
      const el = document.createElement('div');
      el.className = 'particle';
      el.textContent = '👻';
      el.style.fontSize = '32px';
      el.style.left = '0';
      el.style.top = '0';
      document.body.appendChild(el);

      ghosts.push({ el, x, y: y - 20, tx: x, ty: y - 80, born: clock, until: clock + GHOST_LIFE });
    };

    const setKind = function (c, kind) {
      c.kind = kind;
      c.size = kind === 'hen' ? 40 : 24;
      c.el.textContent = kind === 'hen' ? '🐔' : '🐤';
      c.el.style.fontSize = c.size + 'px';
    };

    const addChicken = function (kind, x, y) {
      const el = document.createElement('div');
      el.className = 'chicken';
      document.body.appendChild(el);

      const c = {
        el,
        x, y,
        tx: x, ty: y,
        wait: 0,
        step: 0,
        flip: false,
        // posto fisso attorno al mucchio, sennò mangiano tutti uno sopra l'altro
        ox: rand(-22, 22),
        oy: rand(-10, 10),
        born: clock,
        lastMeal: clock,
        bites: 0,
        seeds: 0,
      };

      setKind(c, kind);
      chickens.push(c);
    };

    const addGrave = function (x, y) {
      const grave = addItem('grave', '🪦', x, y, GRAVE_LIFE);

      if (Math.random() < GHOST_CHANCE) {
        grave.ghostAt = clock + rand(1000, GRAVE_LIFE - 3000);
      }
    };

    const kill = function (c) {
      c.el.remove();
      chickens.splice(chickens.indexOf(c), 1);
      addGrave(c.x, c.y);
    };

    // I due che se ne vanno: il primo piccolo e svelto, il secondo biondo e grosso
    const PEOPLE = {
      leave1: { hair: '#3b2a1a', shirt: '#2e86de', height: 40, speed: 3, eatsRoast: false, likesDiploma: true },
      leave2: { hair: '#f2d16b', shirt: '#c0392b', height: 64, speed: 1.5, eatsRoast: true, likesDiploma: false, hp: 3 },
    };

    // Barra vita sopra la testa, solo per chi ha più di un colpo
    const setBar = function (man) {
      if (man.bar) {
        man.bar.firstChild.style.width = man.hp / man.maxHp * 100 + '%';
      }
    };

    const PANIC_RADIUS = 220;  // px dal mirino entro cui i tizi scappano
    const EAT_TIME = 3000;       // ms per finire una coscia, fermo
    const GRADUATE_TIME = 5000;  // ms per laurearsi, fermo

    const people = [];

    // Fine pasto o fine laurea. Il bersaglio può essere sparito nel frattempo (coscia scaduta).
    const finishTask = function (man) {
      const { kind, target } = man.task;
      man.task = null;

      if (kind === 'eat' && items.includes(target)) {
        target.el.remove();
        items.splice(items.indexOf(target), 1);
        man.hp = man.maxHp; // il pollo ripristina la vita
        setBar(man);
      }

      if (kind === 'graduate' && diploma === target) {
        diploma.el.remove();
        diploma = null;

        const el = document.createElement('div');
        el.className = 'particle';
        el.textContent = '🎓';
        el.style.fontSize = '28px';
        el.style.left = man.x + 'px';
        el.style.top = (man.y - man.h) + 'px';
        document.body.appendChild(el);

        el.animate([
          { transform: 'translate(-50%, -50%) scale(0.5)', opacity: 1 },
          { transform: 'translate(-50%, -200%) scale(1.4) rotate(-20deg)', opacity: 1, offset: 0.5 },
          { transform: 'translate(-50%, -300%) scale(1) rotate(15deg)', opacity: 0 },
        ], { duration: 1500, easing: 'ease-out' }).onfinish = () => el.remove();
      }
    };

    // Serve per sapere dove punta il mirino
    let mouseX = -1e4;
    let mouseY = -1e4;

    document.addEventListener('pointermove', function (e) {
      mouseX = e.clientX;

    });

    const personSvg = (hair, shirt) => `
      <svg viewBox="0 0 20 40" width="100%" height="100%">
        <line x1="8" y1="28" x2="6" y2="39" stroke="#333" stroke-width="2.5" stroke-linecap="round"/>
        <line x1="12" y1="28" x2="14" y2="39" stroke="#333" stroke-width="2.5" stroke-linecap="round"/>
        <rect x="5" y="13" width="10" height="16" rx="3" fill="${shirt}"/>
        <circle cx="10" cy="8" r="5" fill="#f1c27d"/>
        <path d="M4.6 8.5 A5.4 5.4 0 0 1 15.4 8.5 Q10 5 4.6 8.5 Z" fill="${hair}"/>
      </svg>`;

    for (const id of Object.keys(PEOPLE)) {
      $(id).addEventListener('click', function (e) {
        // uno solo per tipo
        if (people.some(man => man.id === id)) {
          return;
        }

        const look = PEOPLE[id];
        const el = document.createElement('div');
        el.className = 'person';
        el.style.width = look.height / 2 + 'px';
        el.style.height = look.height + 'px';
        el.innerHTML = personSvg(look.hair, look.shirt);
        document.body.appendChild(el);

        const x = clampX(e.clientX);
        const y = clampY(e.clientY);
        const maxHp = look.hp || 1;
        let bar = null;

        if (maxHp > 1) {
          bar = document.createElement('div');
          bar.style.cssText = 'position:absolute;left:-4px;right:-4px;top:-8px;height:4px;background:#ddd;border-radius:2px;overflow:hidden';
          bar.innerHTML = '<div style="height:100%;width:100%;background:#2ecc71"></div>';
          el.appendChild(bar);
        }

        people.push({
          id, el, bar, maxHp, hp: maxHp,
          x, y,
          tx: x, ty: y,
          wait: 0,
          step: 0,
          task: null,  // mangiare o laurearsi: finché dura sta fermo
          h: look.height,
          speed: look.speed,
          eatsRoast: look.eatsRoast,
          likesDiploma: look.likesDiploma,
        });
      });
    }

    // Ogni SEEDS_PER_DROP semi: uovo o cacca
    const drop = function (c) {
      if (c.kind === 'hen' && !isFull() && Math.random() < EGG_CHANCE) {
        addItem('egg', '🥚', c.x, c.y, HATCH_TIME);

    $('counter').addEventListener('click', function (e) {

    // Semi e mirino si escludono a vicenda
    // Un attrezzo alla volta; ricliccarlo lo posa
    const setTool = function (name) {
      tool = tool === name ? null : name;
      document.body.dataset.tool = tool || '';
    };

    $('seed').addEventListener('click', () => setTool('seed'));
    $('gun').addEventListener('click', () => setTool('gun'));
    $('degree').addEventListener('click', () => setTool('degree'));

    // Un nuovo titolo sostituisce quello vecchio
    const placeDiploma = function (x, y) {
      if (!diploma) {
        const el = document.createElement('div');

    // Fiammata che sale e si spegne

      el.animate([

    // Tutti i polli diventano cosce, le uova frittate; niente lapidi né fantasmi
    $('fire').addEventListener('click', function () {

      chickens.length = 0;

      for (const it of items) {

    });

    // Esplosione: piume e sangue per i polli, guscio e tuorlo per le uova
    const burst = function (x, y, feathers, colors) {
      for (let i = 0; i < 18; i++) {
        const el = document.createElement('div');
        el.className = 'particle';
        el.style.left = x + 'px';
        el.style.top = y + 'px';

        if (feathers && i % 3 === 0) {
          el.textContent = '🪶';
          el.style.fontSize = rand(12, 20) + 'px';
        } else {
          const r = rand(3, 7);
          el.style.width = el.style.height = r + 'px';
          el.style.borderRadius = '50%';
          el.style.background = colors[i % colors.length];
          el.style.boxShadow = '0 0 1px #0004';
        }

        document.body.appendChild(el);

        const angle = rand(0, 2 * Math.PI);
        const dist = rand(40, 130);
        const dx = Math.cos(angle) * dist;
        const dy = Math.sin(angle) * dist;
        const spin = rand(-360, 360);

        // l'ultimo tratto scende: le piume ricadono
        el.animate([
          { transform: 'translate(-50%, -50%)', opacity: 1 },
          { transform: `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px)) rotate(${spin}deg)`, opacity: 1, offset: 0.6 },
          { transform: `translate(calc(-50% + ${dx * 1.1}px), calc(-50% + ${dy + 40}px)) rotate(${spin * 1.5}deg)`, opacity: 0 },
        ], { duration: rand(700, 1200), easing: 'cubic-bezier(.2, .8, .4, 1)' }).onfinish = () => el.remove();
      }
    };

    // Colpisce il bersaglio più vicino, se il colpo cade dentro la sua sagoma
    const shoot = function (x, y) {
      let target = null;
      let type = null;
      let best = Infinity;

      const consider = function (obj, objType, cx, cy, radius) {
        const d = Math.hypot(cx - x, cy - y);

        if (d < radius + 6 && d < best) {
          best = d;
          target = obj;
          type = objType;
        }
      };

      for (const c of chickens) {
        consider(c, 'chicken', c.x, c.y - c.size / 2, c.size / 2);
      }

      for (const it of items) {
        if (it.kind === 'egg') {
          consider(it, 'egg', it.x, it.y - 13, 13);
        }
      }

      for (const man of people) {
        consider(man, 'person', man.x, man.y - man.h / 2, man.h / 2);
      }

      addItem('boom', '💥', x, y + 12, 250);

      if (!target) {
        return;
      }

      if (type === 'egg') {
        burst(target.x, target.y - 13, false, ['#fff', '#f5c518', '#fff']);
        target.el.remove();
        items.splice(items.indexOf(target), 1);
        addItem('omelette', '🍳', target.x, target.y, OMELETTE_LIFE);
      } else if (type === 'person') {
        burst(target.x, target.y - target.h / 2, false, ['#c0392b', '#8e1b10']);
        target.hp--;
        setBar(target);

        if (target.hp > 0) {
          return;
        }

        target.el.remove();
        people.splice(people.indexOf(target), 1);
        addGrave(target.x, target.y);
      } else {
        burst(target.x, target.y - target.size / 2, true, ['#c0392b', '#fff']);
        kill(target);
      }
    };

    // In capture: con un attrezzo in mano il click non deve far altro (es. far nascere un pollo)
    document.addEventListener('click', function (e) {
      if (!tool || e.target.closest('.tool')) {
        return;
      }

      e.stopPropagation();

      if (tool === 'gun') {
        shoot(e.clientX, e.clientY);
        return;
      }

      if (tool === 'degree') {
        placeDiploma(e.clientX, e.clientY);
        return;
      }

      const el = document.createElement('div');
      el.className = 'pile';
      document.body.appendChild(el);
      piles.push({ el, x: e.clientX, y: e.clientY, amount: PILE_SIZE });
    }, true);

    const frame = function (ts) {
      // tetto a 100 ms: dopo una pausa lunga il tempo non fa salti
      const dt = lastTs === null ? 0 : Math.min(ts - lastTs, 100);
      lastTs = ts;
      clock += dt;

      for (let i = chickens.length - 1; i >= 0; i--) {
        const c = chickens[i];
        const hunger = clock - c.lastMeal;

        if (hunger > STARVE_TIME) {
          kill(c);
          continue;
        }

        if (c.kind === 'chick' && clock - c.born > GROW_TIME) {
          setKind(c, 'hen');
        }

        let food = null;
        let best = FOOD_RADIUS;

        for (const p of piles) {
          const d = Math.hypot(p.x - c.x, p.y - c.y);

          if (d < best) {
            best = d;
            food = p;
          }
        }

        let scary = null;
        let scaryDist = FLEE_RADIUS;

        for (const g of ghosts) {
          const d = Math.hypot(g.x - c.x, g.y - c.y);

          if (d < scaryDist) {
            scaryDist = d;
            scary = g;
          }
        }

        let speed = 0.8;

        if (scary) {
          // la fame passa in secondo piano
          const away = Math.atan2(c.y - scary.y, c.x - scary.x);
          c.tx = clampX(c.x + Math.cos(away) * 80);
          c.ty = clampY(c.y + Math.sin(away) * 80);
          c.wait = 0;
          speed = 3;
          food = null;
        } else if (food) {
          c.tx = food.x + c.ox;
          c.ty = food.y + c.oy;
          c.wait = 0;
          speed = 2.5;
        } else if (c.wait > 0) {
          c.wait--;
        }

        const dx = c.tx - c.x;
        const dy = c.ty - c.y;
        const dist = Math.hypot(dx, dy);
        let peck = 0;

        if (dist > speed) {
          c.x += dx / dist * speed;
          c.y += dy / dist * speed;
          c.step++;

          if (Math.abs(dx) > 0.5) {
            c.flip = dx > 0; // l'emoji guarda a sinistra
          }
        } else if (food) {
          food.amount -= dt / 1000;
          c.bites += dt / 1000;
          peck = (Math.floor(ts / 150) % 2) * 25;

          if (c.bites >= 1) {
            c.bites -= 1;
            c.seeds++;
            c.lastMeal = clock;
          }

          if (c.seeds >= SEEDS_PER_DROP) {
            c.seeds = 0;
            drop(c);
          }
        } else if (c.wait === 0) {
          // razzola: una pausa, poi un punto lì vicino
          c.wait = Math.floor(rand(30, 200));
          c.tx = clampX(c.x + rand(-150, 150));
          c.ty = clampY(c.y + rand(-150, 150));
        }

        const hop = dist > speed ? (Math.floor(c.step / 8) % 2) * -4 : 0;
        c.el.style.opacity = hunger > STARVE_TIME * 0.75 ? 0.5 : 1; // sbiadito: sta per morire di fame
        c.el.style.transform =
          `translate(${c.x - c.size / 2}px, ${c.y - c.size + hop}px) scaleX(${c.flip ? -1 : 1}) rotate(${-peck}deg)`;
      }

      for (let i = piles.length - 1; i >= 0; i--) {
        const p = piles[i];

        if (p.amount <= 0) {
          p.el.remove();
          piles.splice(i, 1);
          continue;
        }

        const scale = 0.3 + 0.7 * p.amount / PILE_SIZE;
        p.el.style.transform = `translate(${p.x - 20}px, ${p.y - 10}px) scale(${scale})`;
      }

      // I tizi girano a caso; col mirino addosso scappano, il biondo va dritto alle cosce,
      // il primo al titolo di studio. Mentre mangiano o si laureano non li smuove niente.
      for (const man of people) {
        if (man.task) {
          man.task.left -= dt;
          man.step++; // mastica o si agita: riusa il saltello

          if (man.task.left <= 0) {
            finishTask(man);
          }

          const hop = (Math.floor(man.step / 6) % 2) * -3;
          man.el.style.transform = `translate(${man.x - man.h / 4}px, ${man.y - man.h + hop}px)`;
          continue;
        }

        let speed = man.speed;
        let meal = null;
        let goal = null;

        if (tool === 'gun' && Math.hypot(man.x - mouseX, man.y - mouseY) < PANIC_RADIUS) {
          // un po' di zig-zag, sennò lungo il muro sono bersagli fermi
          const away = Math.atan2(man.y - mouseY, man.x - mouseX) + rand(-0.8, 0.8);
          man.tx = clampX(man.x + Math.cos(away) * 120);
          man.ty = clampY(man.y + Math.sin(away) * 120);
          man.wait = 0;
          speed *= 3;
        } else if (man.eatsRoast) {
          let best = Infinity;

          for (const it of items) {
            const d = Math.hypot(it.x - man.x, it.y - man.y);

            if (it.kind === 'roast' && d < best) {
              best = d;
              meal = it;
            }
          }

          if (meal) {
            man.tx = meal.x;
            man.ty = meal.y;
            man.wait = 0;
          }
        } else if (man.likesDiploma && diploma) {
          goal = diploma;
          man.tx = clampX(diploma.x + 16); // accanto, non sopra
          man.ty = diploma.y;
          man.wait = 0;
        }

        const dx = man.tx - man.x;
        const dy = man.ty - man.y;
        const dist = Math.hypot(dx, dy);

        if (dist > speed) {
          man.x += dx / dist * speed;
          man.y += dy / dist * speed;
          man.step++;
        } else if (meal) {
          man.task = { kind: 'eat', target: meal, left: EAT_TIME };
        } else if (goal) {
          man.task = { kind: 'graduate', target: goal, left: GRADUATE_TIME };
        } else if (man.wait > 0) {
          man.wait--;
        } else {
          man.wait = Math.floor(rand(20, 120));
          man.tx = clampX(man.x + rand(-250, 250));
          man.ty = clampY(man.y + rand(-200, 200));
        }

        const hop = dist > speed ? (Math.floor(man.step / 6) % 2) * -3 : 0;
        man.el.style.transform = `translate(${man.x - man.h / 4}px, ${man.y - man.h + hop}px)`;
      }

      for (let i = ghosts.length - 1; i >= 0; i--) {
        const g = ghosts[i];

        if (clock >= g.until) {
          g.el.remove();
          ghosts.splice(i, 1);
          continue;
        }

        const dx = g.tx - g.x;
        const dy = g.ty - g.y;
        const dist = Math.hypot(dx, dy);

        if (dist > 0.7) {
          g.x += dx / dist * 0.7;
          g.y += dy / dist * 0.7;
        } else {
          g.tx = clampX(g.x + rand(-100, 100));
          g.ty = clampY(g.y + rand(-60, 60));
        }

        // compare in mezzo secondo, sparisce nell'ultimo
        const fade = Math.min(1, (clock - g.born) / 500, (g.until - clock) / 1000);
        const bob = Math.sin(ts / 300) * 5;
        g.el.style.opacity = fade * 0.85;
        g.el.style.transform = `translate(${g.x - 16}px, ${g.y - 16 + bob}px)`;
      }

      for (let i = items.length - 1; i >= 0; i--) {
        const it = items[i];

        if (it.ghostAt && clock >= it.ghostAt) {
          it.ghostAt = null;
          ghost(it.x, it.y);
        }

        if (clock < it.until) {
          continue;
        }

        it.el.remove();
        items.splice(i, 1);

        if (it.kind === 'egg') {
          addChicken('chick', it.x, it.y);
        }
      }

      requestAnimationFrame(frame);
    };

    requestAnimationFrame(frame);
  </script>
</body>
